name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: Build for iOS
        run: xcodebuild build -scheme LLMPrices -destination 'generic/platform=iOS' -quiet

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        swift: ["5.9", "6.1"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
